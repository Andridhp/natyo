            <button class="close-btn" data-action="closeModal">✕</button>
          </div>
          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
            <select id="balanceMonth" style="padding:8px 12px;border:2px solid #e8e8e4;border-radius:10px;font-size:13px;">
              ${monthNames.map((name, idx) => `
                <option value="${idx + 1}" ${state.balanceMonth === idx + 1 ? 'selected' : ''}>${name}</option>
              `).join('')}
            </select>
            <input type="number" id="balanceYear" value="${state.balanceYear}" style="padding:8px 12px;border:2px solid #e8e8e4;border-radius:10px;font-size:13px;width:80px;" />
            <button class="btn-secondary" data-action="updateBalanceModal">Actualizar</button>
            <button class="btn-pdf" data-action="exportPDFModal">📄 PDF</button>
            <button class="btn-excel" data-action="exportExcelModal">📊 Excel</button>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;">
            <div style="background:#f8f4f2;padding:12px;border-radius:12px;">
              <p style="font-size:11px;color:#8d99ae;">Ventas totales</p>
              <p style="font-size:18px;font-weight:700;">$${balance.totalSales.toFixed(2)}</p>
            </div>
            <div style="background:#f8f4f2;padding:12px;border-radius:12px;">
              <p style="font-size:11px;color:#8d99ae;">Gastos totales</p>
              <p style="font-size:18px;font-weight:700;color:#dc2626;">$${balance.totalGastos.toFixed(2)}</p>
            </div>
            <div style="background:#f8f4f2;padding:12px;border-radius:12px;">
              <p style="font-size:11px;color:#8d99ae;">Utilidad</p>
              <p style="font-size:18px;font-weight:700;color:${balance.utilidad >= 0 ? '#059669' : '#dc2626'};">$${balance.utilidad.toFixed(2)}</p>
            </div>
          </div>

          <div style="margin-bottom:16px;">
            <h4 style="font-size:14px;font-weight:600;color:#1f2937;margin-bottom:8px;">🧪 Mezcla Registrada vs Vendida</h4>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
              <div style="background:#f8f4f2;padding:12px;border-radius:12px;">
                <p style="font-size:11px;color:#8d99ae;">Yogurt</p>
                <p style="font-size:14px;"><strong>Registrada:</strong> ${balance.mezclaPorTipo.yogurt}</p>
                <p style="font-size:14px;"><strong>Vendida:</strong> ${balance.ventasPorTipo.yogurtPorciones.toFixed(1)}</p>
                <p style="font-size:14px;font-weight:700;color:${(balance.mezclaPorTipo.yogurt - balance.ventasPorTipo.yogurtPorciones) >= 0 ? '#059669' : '#dc2626'}">
                  ${(balance.mezclaPorTipo.yogurt - balance.ventasPorTipo.yogurtPorciones).toFixed(1)}
                </p>
              </div>
              <div style="background:#f8f4f2;padding:12px;border-radius:12px;">
                <p style="font-size:11px;color:#8d99ae;">Gelato</p>
                <p style="font-size:14px;"><strong>Registrada:</strong> ${balance.mezclaPorTipo.gelato}</p>
                <p style="font-size:14px;"><strong>Vendida:</strong> ${balance.ventasPorTipo.gelatoPorciones.toFixed(1)}</p>
                <p style="font-size:14px;font-weight:700;color:${(balance.mezclaPorTipo.gelato - balance.ventasPorTipo.gelatoPorciones) >= 0 ? '#059669' : '#dc2626'}">
                  ${(balance.mezclaPorTipo.gelato - balance.ventasPorTipo.gelatoPorciones).toFixed(1)}
                </p>
              </div>
            </div>
          </div>

          <div style="margin-bottom:16px;">
            <h4 style="font-size:14px;font-weight:600;color:#1f2937;margin-bottom:8px;">📋 Registros de Mezcla</h4>
            ${mixTableHTML}
          </div>

          <div style="margin-bottom:16px;">
            <h4 style="font-size:14px;font-weight:600;color:#1f2937;margin-bottom:8px;">📊 Distribución de Gastos</h4>
            ${gastosHTML}
          </div>

          <div class="modal-actions" style="margin-top:16px;">
            <button class="cancel-btn" data-action="closeModal">Cerrar</button>
          </div>
        </div>
      `;

      document.body.appendChild(modal);

      // Cerrar modal
      modal.querySelector('[data-action="closeModal"]')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      // Actualizar balance
      modal.querySelector('[data-action="updateBalanceModal"]')?.addEventListener('click', () => {
        const month = parseInt(modal.querySelector('#balanceMonth').value);
        const year = parseInt(modal.querySelector('#balanceYear').value);
        if (month >= 1 && month <= 12 && year > 2000) {
          state.balanceMonth = month;
          state.balanceYear = year;
          modal.remove();
          showBalanceModal();
        } else {
          alert('Mes o año inválido');
        }
      });

      // Editar registro de mezcla desde balance
      modal.querySelectorAll('[data-action="editMixRecordBalance"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const porcionesActuales = parseFloat(btn.dataset.porciones);
          const tipo = btn.dataset.tipo;
          
          const nuevasPorciones = prompt(`✏️ Editar porciones de ${tipo}\nActual: ${porcionesActuales}`, porcionesActuales);
          if (nuevasPorciones !== null) {
            const nuevoValor = parseFloat(nuevasPorciones);
            if (!isNaN(nuevoValor) && nuevoValor >= 0) {
              updateMixRecord(id, nuevoValor);
              modal.remove();
              showBalanceModal();
              render();
            } else {
              alert('Ingresa un valor válido');
            }
          }
        });
      });

      // Exportar PDF
      modal.querySelector('[data-action="exportPDFModal"]')?.addEventListener('click', () => {
        exportBalancePDF();
      });

      // Exportar Excel
      modal.querySelector('[data-action="exportExcelModal"]')?.addEventListener('click', () => {
        exportBalanceExcel();
      });
    }

    // ============================================
    // EXPORTACIÓN
    // ============================================
    function exportBalancePDF() {
      const balance = getBalance(state.balanceYear, state.balanceMonth);
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre',
        'Noviembre', 'Diciembre'
      ];
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.text('NATYO POS - Balance Mensual', 14, 22);
      doc.setFontSize(12);
      doc.text(`Período: ${monthNames[state.balanceMonth - 1]} ${state.balanceYear}`, 14, 32);
      doc.text(`Usuario: Responsable`, 14, 40);

      doc.setFontSize(14);
      doc.text('Resumen', 14, 52);
      doc.setFontSize(12);
      doc.text(`Ventas totales: $${balance.totalSales.toFixed(2)}`, 14, 62);
      doc.text(`Gastos totales: $${balance.totalGastos.toFixed(2)}`, 14, 70);
      doc.text(`Utilidad: $${balance.utilidad.toFixed(2)}`, 14, 78);
      doc.text(`Tickets: ${balance.salesCount}`, 14, 86);

      doc.setFontSize(14);
      doc.text('Relación Mezcla vs Ventas', 14, 98);
      doc.setFontSize(12);
      doc.text(`Yogurt - Ventas: ${balance.ventasPorTipo.yogurt} (${balance.ventasPorTipo.yogurtPorciones.toFixed(1)} porc.) | Mezcla: ${balance.mezclaPorTipo.yogurt}`, 14, 108);
      doc.text(`Gelato - Ventas: ${balance.ventasPorTipo.gelato} (${balance.ventasPorTipo.gelatoPorciones.toFixed(1)} porc.) | Mezcla: ${balance.mezclaPorTipo.gelato}`, 14, 116);

      doc.setFontSize(14);
      doc.text('Desglose de Gastos', 14, 128);

      const tableData = balance.gastosPorSubcategoria.map(([cat, amount]) => {
        const percent = balance.totalGastos > 0 ? (amount / balance.totalGastos) * 100 : 0;
        return [cat, `$${amount.toFixed(2)}`, `${percent.toFixed(1)}%`];
      });
      tableData.push(['TOTAL', `$${balance.totalGastos.toFixed(2)}`, '100%']);

      doc.autoTable({
        startY: 132,
        head: [
          ['Subcategoría', 'Monto', '% del total']
        ],
        body: tableData,
        styles: { fontSize: 10 },
        headStyles: { fillColor: [224, 122, 95] }
      });

      doc.save(`Balance_${monthNames[state.balanceMonth - 1]}_${state.balanceYear}.pdf`);
    }

    function exportBalanceExcel() {
      const balance = getBalance(state.balanceYear, state.balanceMonth);
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre',
        'Noviembre', 'Diciembre'
      ];

      const data = [
        ['NATYO POS - Balance Mensual'],
        [`Período: ${monthNames[state.balanceMonth - 1]} ${state.balanceYear}`],
        ['Usuario: Responsable'],
        [],
        ['RESUMEN'],
        ['Ventas totales', balance.totalSales],
        ['Gastos totales', balance.totalGastos],
        ['Utilidad', balance.utilidad],
        ['Tickets', balance.salesCount],
        [],
        ['RELACIÓN MEZCLA VS VENTAS'],
        ['Tipo', 'Ventas (uds)', 'Porciones Vendidas', 'Mezcla Registrada'],
        ['Yogurt', balance.ventasPorTipo.yogurt, balance.ventasPorTipo.yogurtPorciones, balance.mezclaPorTipo.yogurt],
        ['Gelato', balance.ventasPorTipo.gelato, balance.ventasPorTipo.gelatoPorciones, balance.mezclaPorTipo.gelato],
        [],
        ['DESGLOSE DE GASTOS'],
        ['Subcategoría', 'Monto', '% del total']
      ];

      balance.gastosPorSubcategoria.forEach(([cat, amount]) => {
        const percent = balance.totalGastos > 0 ? (amount / balance.totalGastos) * 100 : 0;
        data.push([cat, amount, percent]);
      });
      data.push(['TOTAL', balance.totalGastos, 100]);

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, 'Balance');
      XLSX.writeFile(wb, `Balance_${monthNames[state.balanceMonth - 1]}_${state.balanceYear}.xlsx`);
    }

    // ============================================
    // EVENTOS
    // ============================================
    function attachEvents() {
      // Navegación
      document.querySelectorAll('.bottom-nav button[data-view]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.currentView = btn.dataset.view;
          render();
        });
      });

      // Categorías
      document.querySelectorAll('.categories button[data-category]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedCategory = btn.dataset.category;
          render();
        });
      });

      // Búsqueda
      document.getElementById('searchInput')?.addEventListener('input', (e) => {
        state.searchTerm = e.target.value;
        render();
      });

      // Agregar al carrito
      document.querySelectorAll('.product-card[data-product]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.product);
          const product = getProductById(id);
          if (product) {
            const stock = getProductStock(product);
            if (stock <= 0) {
              alert('❌ Este producto está agotado');
              return;
            }
            const existing = state.cart.find(i => i.id === id);
            if (existing) {
              if (existing.quantity + 1 > stock) {
                alert(`⚠️ Solo hay ${stock} unidades disponibles`);
                return;
              }
              existing.quantity += 1;
            } else {
              state.cart.push({ ...product, quantity: 1 });
            }
            if (navigator.vibrate) navigator.vibrate(10);
            render();
          }
        });
      });

      // Cantidad
      document.querySelectorAll('[data-action="qty"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const delta = parseInt(btn.dataset.delta);
          const item = state.cart.find(i => i.id === id);
          if (item) {
            const stock = getProductStock(getProductById(id));
            if (delta > 0 && item.quantity + delta > stock) {
              alert(`⚠️ Solo hay ${stock} unidades disponibles`);
              return;
            }
            item.quantity += delta;
            if (item.quantity <= 0) state.cart = state.cart.filter(i => i.id !== id);
            render();
          }
        });
      });

      // Remover del carrito
      document.querySelectorAll('[data-action="remove"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          state.cart = state.cart.filter(i => i.id !== id);
          render();
        });
      });

      // Checkout
      document.querySelector('[data-action="checkout"]')?.addEventListener('click', () => {
        if (state.cart.length === 0) { alert('El carrito está vacío'); return; }
        const openSession = getOpenCashSession();
        if (!openSession) { alert('⚠️ No hay caja abierta. Ve a "Caja" y abre una sesión.'); return; }
        state.showCheckout = true;
        render();
      });

      document.querySelector('[data-action="cancelCheckout"]')?.addEventListener('click', () => {
        state.showCheckout = false;
        render();
      });

      // CORREGIDO: Confirmar venta
      document.querySelector('[data-action="confirmCheckout"]')?.addEventListener('click', function() {
        const total = state.cart.reduce((s, i) => s + i.price * i.quantity, 0);
        const method = document.getElementById('paymentMethod')?.value || 'efectivo';
        let change = 0;
        if (method === 'codi' || method === 'transferencia' || method === 'tarjeta') {
          // no necesita cambio
        } else if (method === 'efectivo') {
          const received = parseFloat(document.getElementById('cashReceived')?.value);
          if (isNaN(received) || received < total) {
            alert('El monto entregado debe ser mayor o igual al total');
            return;
          }
          change = received - total;
        }

        const openSession = getOpenCashSession();
        const saleData = {
          items: state.cart.map(i => ({ productId: i.id, name: i.name, price: i.price, quantity: i.quantity })),
          total: total,
          paymentMethod: method,
          cashSessionId: openSession ? openSession.id : null,
          userId: 'responsable',
          branch: 'Centro',
          change: change
        };

        // Registrar la venta (esto descuenta stock y porciones de mezcla)
        addSale(saleData);
        
        // Mostrar resumen de venta en modal grande
        showSaleSummary(saleData);

        // Limpiar carrito
        state.cart = [];
        state.showCheckout = false;
        state.cashReceived = '';
        
        // Renderizar después de un pequeño delay para que el modal se muestre bien
        setTimeout(() => {
          render();
        }, 100);
      });

      // --- Productos ---
      document.getElementById('productSearch')?.addEventListener('input', (e) => {
        const search = e.target.value.toLowerCase();
        document.querySelectorAll('#productTableBody tr').forEach(row => {
          row.style.display = row.textContent.toLowerCase().includes(search) ? '' : 'none';
        });
      });

      document.querySelector('[data-action="addProduct"]')?.addEventListener('click', () => showProductModal());
      document.querySelectorAll('[data-action="editProduct"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const product = getProductById(id);
          if (product) showProductModal(product);
        });
      });
      document.querySelectorAll('[data-action="deleteProduct"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const product = getProductById(id);
          if (product && confirm(`¿Eliminar "${product.name}" permanentemente?`)) {
            deleteProduct(id);
            render();
          }
        });
      });
      document.querySelectorAll('[data-action="toggleProduct"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const product = getProductById(id);
          if (product) { updateProduct(id, { isActive: !product.isActive });
            render(); }
        });
      });

      // --- Caja ---
      document.querySelector('[data-action="openCash"]')?.addEventListener('click', () => {
        const initial = prompt('💰 Monto inicial en caja:', '0');
        if (initial !== null && !isNaN(parseFloat(initial))) {
          openCashSession(parseFloat(initial));
          render();
        }
      });

      document.querySelector('[data-action="closeCash"]')?.addEventListener('click', () => {
        const openSession = getOpenCashSession();
        if (!openSession) return;
        showCloseCashModal(openSession);
      });

      document.querySelector('[data-action="cashWithdraw"]')?.addEventListener('click', () => {
        showCashWithdrawModal();
      });

      document.querySelector('[data-action="addMovement"]')?.addEventListener('click', () => showMovementModal());
      document.querySelectorAll('[data-action="deleteMovement"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          if (confirm('¿Eliminar este movimiento?')) { deleteCashMovement(id);
            render(); }
        });
      });

      document.querySelector('[data-action="showBalance"]')?.addEventListener('click', () => {
        showBalanceModal();
      });

      document.querySelectorAll('[data-action="viewCashSummary"]').forEach(btn => {
        btn.addEventListener('click', function() {
          const id = parseInt(this.dataset.id);
          const session = state.cashSessions.find(s => s.id === id);
          if (session) showCloseCashModal(session);
        });
      });

      document.getElementById('movementFilterType')?.addEventListener('change', (e) => {
        state.movementFilterType = e.target.value;
        render();
      });
      document.getElementById('movementFilterDate')?.addEventListener('change', (e) => {
        state.movementFilterDate = e.target.value;
        render();
      });
      document.querySelector('[data-action="clearFilters"]')?.addEventListener('click', () => {
        state.movementFilterType = 'todos';
        state.movementFilterDate = '';
        render();
      });

      // --- Inventario ---
      document.querySelectorAll('[data-action="editProductStock"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const label = btn.dataset.label;
          const currentValue = parseInt(btn.dataset.value) || 0;
          showEditProductStockModal(id, label, currentValue);
        });
      });

      document.querySelectorAll('[data-action="editStockItem"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          const label = btn.dataset.label;
          const unit = btn.dataset.unit;
          const currentValue = parseFloat(btn.dataset.value);
          showEditStockItemModal(key, label, unit, currentValue);
        });
      });

      document.querySelectorAll('[data-action="editMixRecord"]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const porcionesActuales = parseFloat(btn.dataset.porciones);
          const nuevasPorciones = prompt(`✏️ Editar porciones de mezcla\nActual: ${porcionesActuales}`, porcionesActuales);
          if (nuevasPorciones !== null) {
            const nuevoValor = parseFloat(nuevasPorciones);
            if (!isNaN(nuevoValor) && nuevoValor >= 0) {
              updateMixRecord(id, nuevoValor);
              render();
            } else {
              alert('Ingresa un valor válido');
            }
          }
        });
      });

      document.querySelector('[data-action="registerMix"]')?.addEventListener('click', () => showMixModal());
      document.querySelector('[data-action="registerMerma"]')?.addEventListener('click', () => showMermaModal());
    }

    function showProductModal(product = null) {
      const isEdit = !!product;
      const categories = getCategories();
      let imageData = product?.image || '';

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>${isEdit ? '✏️ Editar Producto' : '➕ Nuevo Producto'}</h3>
            <button class="close-btn" data-action="closeModal">✕</button>
          </div>
          <form id="productForm">
            <div class="form-group"><label>Nombre *</label><input id="pName" type="text" value="${isEdit ? product.name : ''}" required /></div>
            <div class="form-row" style="display:flex;gap:12px;">
              <div class="form-group" style="flex:1;"><label>Precio *</label><input id="pPrice" type="number" step="0.01" min="0" value="${isEdit ? product.price : ''}" required /></div>
              <div class="form-group" style="flex:1;"><label>Categoría</label>
                <select id="pCategory">
                  <option value="">Sin categoría</option>
                  ${categories.map(cat => `<option value="${cat}" ${isEdit && product.category === cat ? 'selected' : ''}>${cat}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="form-group"><label>Emoji</label><input id="pEmoji" type="text" placeholder="🍦" maxlength="2" value="${isEdit ? product.emoji || '' : ''}" /></div>
            <div class="form-group"><label>Descripción</label><textarea id="pDesc" placeholder="Breve descripción...">${isEdit ? product.desc || '' : ''}</textarea></div>
            <div class="form-group">
              <label>Porciones de mezcla que consume</label>
              <input id="pPorciones" type="number" step="0.5" min="0" value="${isEdit ? product.porcionesConsumo || 0 : 0}" />
              <span style="font-size:12px;color:#8d99ae;">Solo aplica para helados (Chico=1, Mediano=1.5, Grande=3)</span>
            </div>
            <div class="form-group">
              <label>Stock inicial</label>
              <input id="pStock" type="number" step="1" min="0" value="${isEdit ? (product.stock || 0) : 0}" />
            </div>
            <div class="form-group">
              <label>Imagen</label>
              ${imageData ? `<img src="${imageData}" class="image-preview" id="imagePreview" />` : ''}
              <div class="image-actions">
                <button type="button" data-action="takePhoto">📷 Tomar foto</button>
                <button type="button" data-action="chooseImage">🖼️ Seleccionar de galería</button>
                ${imageData ? `<button type="button" data-action="removeImage">❌ Eliminar imagen</button>` : ''}
              </div>
              <input type="file" id="fileInput" accept="image/*" style="display:none;" />
              <input type="hidden" id="pImage" value="${imageData}" />
            </div>
            <div class="modal-actions">
              <button type="button" class="cancel-btn" data-action="closeModal">Cancelar</button>
              <button type="submit" class="save-btn">${isEdit ? 'Actualizar' : 'Guardar'}</button>
            </div>
          </form>
        </div>
      `;

      document.body.appendChild(modal);

      modal.querySelector('[data-action="closeModal"]')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      modal.querySelector('[data-action="takePhoto"]')?.addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = 'environment';
        input.onchange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (ev) => {
              const data = ev.target.result;
              document.getElementById('pImage').value = data;
              const preview = document.getElementById('imagePreview');
              if (preview) { preview.src = data; } else {
                const container = document.querySelector('.image-actions');
                const img = document.createElement('img');
                img.className = 'image-preview';
                img.id = 'imagePreview';
                img.src = data;
                container.parentNode.insertBefore(img, container);
              }
            };
            reader.readAsDataURL(file);
          }
        };
        input.click();
      });

      modal.querySelector('[data-action="chooseImage"]')?.addEventListener('click', () => {
        document.getElementById('fileInput').click();
      });

      modal.querySelector('[data-action="removeImage"]')?.addEventListener('click', () => {
        document.getElementById('pImage').value = '';
        const preview = document.getElementById('imagePreview');
        if (preview) preview.remove();
      });

      document.getElementById('fileInput')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const data = ev.target.result;
            document.getElementById('pImage').value = data;
            const preview = document.getElementById('imagePreview');
            if (preview) { preview.src = data; } else {
              const container = document.querySelector('.image-actions');
              const img = document.createElement('img');
              img.className = 'image-preview';
              img.id = 'imagePreview';
              img.src = data;
              container.parentNode.insertBefore(img, container);
            }
          };
          reader.readAsDataURL(file);
        }
      });

      document.getElementById('productForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('pName').value.trim();
        const price = parseFloat(document.getElementById('pPrice').value);
        const category = document.getElementById('pCategory').value;
        const emoji = document.getElementById('pEmoji').value.trim();
        const desc = document.getElementById('pDesc').value.trim();
        const image = document.getElementById('pImage').value || null;
        const stock = parseInt(document.getElementById('pStock').value) || 0;
        const porcionesConsumo = parseFloat(document.getElementById('pPorciones').value) || 0;

        if (!name || isNaN(price)) { alert('Nombre y precio son obligatorios'); return; }

        const data = { name, price, category, emoji: emoji || '📦', desc, image, stock, porcionesConsumo };
        if (isEdit) updateProduct(product.id, data);
        else addProduct(data);
        modal.remove();
        render();
      });
    }

        }

        const typeObj = MOVEMENT_TYPES.find(t => t.value === type);

        const processMovement = (receiptImage = null) => {

      modal.querySelector('[data-action="closeModal"]')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      document.getElementById('mixForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const tipo = document.getElementById('m_tipo').value;
        const porciones = parseInt(document.getElementById('m_porciones').value) || 80;

        registrarMezcla(tipo, porciones);
        alert(`✅ Mezcla de ${tipo} registrada correctamente.\n${porciones} porciones.`);
        modal.remove();
        render();
      });
    }

    function showMermaModal() {
      const tipos = [
        { value: 'toppings', label: 'Toppings' },
        { value: 'mezclaYogurt', label: 'Mezcla Yogurt' },
        { value: 'mezclaGelato', label: 'Mezcla Gelato' }
      ];

      const products = getProducts();
      products.forEach(p => {
        tipos.push({ value: 'producto_' + p.id, label: p.name });
      });

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>📋 Registrar Merma</h3>
            <button class="close-btn" data-action="closeModal">✕</button>
          </div>
          <form id="mermaForm">
            <div class="form-group">
              <label>Tipo *</label>
              <select id="m_tipo" required>
                <option value="">Seleccionar...</option>
                ${tipos.map(t => `<option value="${t.value}">${t.label}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Cantidad *</label>
              <input id="m_cantidad" type="number" step="0.1" min="0.01" required />
            </div>
            <div class="form-group">
              <label>Motivo</label>
              <input id="m_motivo" type="text" placeholder="Ej: Producto dañado" />
            </div>
            <div class="modal-actions">
              <button type="button" class="cancel-btn" data-action="closeModal">Cancelar</button>
              <button type="submit" class="save-btn">✅ Registrar</button>
            </div>
          </form>
        </div>
      `;

      document.body.appendChild(modal);

      modal.querySelector('[data-action="closeModal"]')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      document.getElementById('mermaForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const tipo = document.getElementById('m_tipo').value;
        const cantidad = parseFloat(document.getElementById('m_cantidad').value);
        const motivo = document.getElementById('m_motivo').value.trim() || 'Sin especificar';

        if (!tipo || isNaN(cantidad) || cantidad <= 0) {
          alert('Todos los campos son obligatorios');
          return;
        }

        const data = { tipo, cantidad, motivo, userId: 'responsable' };
        if (tipo.startsWith('producto_')) {
          const productId = parseInt(tipo.replace('producto_', ''));
          data.productId = productId;
        }
        addMerma(data);
        alert('✅ Merma registrada correctamente.');
        modal.remove();
        render();
      });
    }

    function showCashWithdrawModal() {
      const openSession = getOpenCashSession();
      if (!openSession) { alert('⚠️ Debes abrir caja primero'); return; }

      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>🏦 Retiro de efectivo</h3>
            <button class="close-btn" data-action="closeModal">✕</button>
          </div>
          <form id="cashWithdrawForm">
            <div class="form-group">
              <label>Monto *</label>
              <input id="w_amount" type="number" step="0.01" min="0.01" required placeholder="0.00" />
            </div>
            <div class="form-group">
              <label>Concepto *</label>
              <input id="w_concept" type="text" required placeholder="Ej: Cambio para el día" />
            </div>
            <div class="form-group">
              <label>Comprobante (opcional)</label>
              <input type="file" id="w_receipt" accept="image/*" />
            </div>
            <div style="font-size:12px;color:#8d99ae;margin-bottom:8px;">
              📌 Este retiro será registrado a nombre del Responsable.
            </div>
            <div class="modal-actions">
              <button type="button" class="cancel-btn" data-action="closeModal">Cancelar</button>
              <button type="submit" class="save-btn">✅ Confirmar retiro</button>
            </div>
          </form>
        </div>
      `;

      document.body.appendChild(modal);

      modal.querySelector('[data-action="closeModal"]')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      document.getElementById('cashWithdrawForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const amount = parseFloat(document.getElementById('w_amount').value);
        const concept = document.getElementById('w_concept').value.trim();
        const receiptFile = document.getElementById('w_receipt').files[0];

        if (!concept || isNaN(amount) || amount <= 0) {
          alert('Todos los campos son obligatorios');
          return;
        }

        const processWithdraw = (receiptImage = null) => {
          const data = {
            cashSessionId: openSession.id,
            type: 'retiro_efectivo',
            subcategory: 'Retiro de efectivo',
            concept: concept,
            amount: amount,
            direction: 'egreso',
            userId: 'responsable',
            receiptImage: receiptImage
          };
          addCashMovement(data);
          modal.remove();
          render();
        };

        if (receiptFile) {
          const reader = new FileReader();
          reader.onload = (ev) => processWithdraw(ev.target.result);
          reader.readAsDataURL(receiptFile);
        } else {
          processWithdraw();
        }
      });
    }

    // ============================================
    // MODALES DE STOCK
    // ============================================
    function showEditProductStockModal(productId, label, currentValue) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>✏️ Editar stock de ${label}</h3>
            <button class="close-btn" data-action="closeModal">✕</button>
          </div>
          <form id="editProductStockForm">
            <div class="form-group">
              <label>Stock actual</label>
              <p style="font-size:14px;color:#4a4a4a;">${currentValue}</p>
            </div>
            <div class="form-group">
              <label>Nuevo stock</label>
              <input id="newStockValue" type="number" step="1" min="0" value="${currentValue}" required />
            </div>
            <div class="modal-actions">
              <button type="button" class="cancel-btn" data-action="closeModal">Cancelar</button>
              <button type="submit" class="save-btn">Guardar</button>
            </div>
          </form>
        </div>
      `;

      document.body.appendChild(modal);

      modal.querySelector('[data-action="closeModal"]')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      document.getElementById('editProductStockForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newValue = parseInt(document.getElementById('newStockValue').value);
        if (!isNaN(newValue) && newValue >= 0) {
          const product = getProductById(productId);
          if (product) {
            product.stock = newValue;
            saveState();
            modal.remove();
            render();
          } else {
            alert('Producto no encontrado');
          }
        } else {
          alert('Ingresa un valor válido');
        }
      });
    }

    function showEditStockItemModal(key, label, unit, currentValue) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal">
          <div class="modal-header">
            <h3>✏️ Editar ${label}</h3>
            <button class="close-btn" data-action="closeModal">✕</button>
          </div>
          <form id="editStockItemForm">
            <div class="form-group">
              <label>Stock actual</label>
              <p style="font-size:14px;color:#4a4a4a;">${currentValue} ${unit}</p>
            </div>
            <div class="form-group">
              <label>Nuevo stock (${unit})</label>
              <input id="newStockValue" type="number" step="0.1" min="0" value="${currentValue}" required />
            </div>
            <div class="modal-actions">
              <button type="button" class="cancel-btn" data-action="closeModal">Cancelar</button>
              <button type="submit" class="save-btn">Guardar</button>
            </div>
          </form>
        </div>
      `;

      document.body.appendChild(modal);

      modal.querySelector('[data-action="closeModal"]')?.addEventListener('click', () => modal.remove());
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });

      document.getElementById('editStockItemForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const newValue = parseFloat(document.getElementById('newStockValue').value);
        if (!isNaN(newValue) && newValue >= 0) {
          state.inventory[key] = newValue;
          saveState();
          modal.remove();
          render();
        } else {
          alert('Ingresa un valor válido');
        }
      });
    }

    // ============================================
    // INICIO
    // ============================================
    loadState();
    render();
  </script>
</body>
