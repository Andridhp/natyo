    // ============================================
    // EXPORTACIÓN
    // ============================================
    function exportBalancePDF() {
      const balance = getBalance(state.balanceYear, state.balanceMonth);
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre',
        'Noviembre', 'Diciembre'
      ];
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(18);
      doc.text('NATYO POS - Balance Mensual', 14, 22);
      doc.setFontSize(12);
      doc.text(`Período: ${monthNames[state.balanceMonth - 1]} ${state.balanceYear}`, 14, 32);
      doc.text(`Usuario: ${state.currentUser.username}`, 14, 40);
      doc.text(`Rol: ${state.currentUser.role === 'responsable' ? 'Responsable' : 'Colaborador'}`, 14, 48);

      doc.setFontSize(14);
      doc.text('Resumen', 14, 60);
      doc.setFontSize(12);
      doc.text(`Ventas totales: $${balance.totalSales.toFixed(2)}`, 14, 70);
      doc.text(`Gastos totales: $${balance.totalGastos.toFixed(2)}`, 14, 78);
      doc.text(`Utilidad: $${balance.utilidad.toFixed(2)}`, 14, 86);
      doc.text(`Tickets: ${balance.salesCount}`, 14, 94);

      doc.setFontSize(14);
      doc.text('Desglose de Gastos', 14, 106);

      const tableData = balance.gastosPorSubcategoria.map(([cat, amount]) => {
        const percent = balance.totalGastos > 0 ? (amount / balance.totalGastos) * 100 : 0;
        return [cat, `$${amount.toFixed(2)}`, `${percent.toFixed(1)}%`];
      });
      tableData.push(['TOTAL', `$${balance.totalGastos.toFixed(2)}`, '100%']);

      doc.autoTable({
        startY: 110,
        head: [
          ['Subcategoría', 'Monto', '% del total']
        ],
        body: tableData,
        styles: { fontSize: 10 },
        headStyles: { fillColor: [224, 122, 95] }
      });

      doc.save(`Balance_${monthNames[state.balanceMonth - 1]}_${state.balanceYear}.pdf`);
    }

    function exportBalanceExcel() {
      const balance = getBalance(state.balanceYear, state.balanceMonth);
      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre',
        'Noviembre', 'Diciembre'
      ];

      const data = [
        ['NATYO POS - Balance Mensual'],
        [`Período: ${monthNames[state.balanceMonth - 1]} ${state.balanceYear}`],
        [`Usuario: ${state.currentUser.username}`],
        [`Rol: ${state.currentUser.role === 'responsable' ? 'Responsable' : 'Colaborador'}`],
        [],
        ['RESUMEN'],
        ['Ventas totales', balance.totalSales],
        ['Gastos totales', balance.totalGastos],
        ['Utilidad', balance.utilidad],
        ['Tickets', balance.salesCount],
        [],
        ['DESGLOSE DE GASTOS'],
        ['Subcategoría', 'Monto', '% del total']
      ];

      balance.gastosPorSubcategoria.forEach(([cat, amount]) => {
        const percent = balance.totalGastos > 0 ? (amount / balance.totalGastos) * 100 : 0;
        data.push([cat, amount, percent]);
      });
      data.push(['TOTAL', balance.totalGastos, 100]);

      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet(data);
      XLSX.utils.book_append_sheet(wb, ws, 'Balance');
      XLSX.writeFile(wb, `Balance_${monthNames[state.balanceMonth - 1]}_${state.balanceYear}.xlsx`);
    }

    // ============================================
    // GUARDAR ESTADO (localStorage)
    // ============================================
    function saveState() {
      try {
        localStorage.setItem('natyopos_state', JSON.stringify({
          products: state.products,
          categories: state.categories,
          subcategories: state.subcategories,
          users: state.users,
          inventory: state.inventory,
          cashSessions: state.cashSessions,
          sales: state.sales,
          cashMovements: state.cashMovements,
          mermas: state.mermas
        }));
      } catch (e) {
        console.warn('No se pudo guardar en localStorage:', e);
      }
    }

    // ============================================
    // INICIO
    // ============================================
    try {
      const saved = localStorage.getItem('natyopos_state');
      if (saved) {
        const parsed = JSON.parse(saved);
        state.products = parsed.products || DEFAULT_PRODUCTS;
        state.categories = parsed.categories || DEFAULT_CATEGORIES;
        state.subcategories = parsed.subcategories || DEFAULT_SUBCATEGORIES;
        state.users = parsed.users || DEFAULT_USERS;
        state.inventory = parsed.inventory || DEFAULT_INVENTORY;
        state.cashSessions = parsed.cashSessions || [];
        state.sales = parsed.sales || [];
        state.cashMovements = parsed.cashMovements || [];
        state.mermas = parsed.mermas || [];
      }
    } catch (e) {
      console.warn('No se pudieron cargar los datos guardados:', e);
    }

    render();
  </script>
